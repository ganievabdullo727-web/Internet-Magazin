<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMIÈRE | Корзина</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-blob blob-1"></div>
  <div class="bg-blob blob-2"></div>

  <div class="container">
    <header>
      <nav class="nav-glass">
        <a href="index.html" class="logo">LUMIÈRE</a>
        <ul class="nav-links">
          <li><a href="index.html">Главная</a></li>
          <li><a href="catalog.html">Каталог</a></li>
          <li><a href="cart.html" class="active cart-icon-btn">Корзина <span class="cart-badge" id="cart-count">0</span></a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 style="letter-spacing: 4px; font-weight: 300; margin-bottom: 30px;">ВАША КОРЗИНА</h1>

      <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 30px;">
        <!-- Таблица товаров -->
        <div class="glass-card">
          <table class="cart-table">
            <thead>
              <tr>
                <th>Товар</th>
                <th>Цена</th>
                <th>Действие</th>
              </tr>
            </thead>
            <tbody id="cart-items-body">
              <!-- Товары подгружаются из script.js -->
            </tbody>
          </table>
          <div style="text-align: right; font-size: 1.3rem; font-weight: bold; margin-top: 20px;">
            Итого: <span id="cart-total-price" style="color: #38bdf8;">$ 0</span>
          </div>
        </div>

        <!-- Оформление заказа -->
        <div class="glass-card">
          <h3 style="margin-bottom: 20px; font-weight: 400; letter-spacing: 2px;">ОФОРМЛЕНИЕ</h3>
          <form onsubmit="submitOrder(event)">
            <div class="form-group">
              <input type="text" class="form-input" placeholder="Ваше Имя" required>
            </div>
            <div class="form-group">
              <input type="email" class="form-input" placeholder="Email" required>
            </div>
            <div class="form-group">
              <input type="tel" class="form-input" placeholder="Телефон" required>
            </div>
            <button type="submit" class="btn-glass" style="width: 100%;">Заказать</button>
          </form>
        </div>
      </div>
    </main>

    <footer>
      <p>© 2026 LUMIÈRE. Все права защищены. Зеркальный минимализм.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
